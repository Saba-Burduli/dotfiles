# Sanitized global Codex preferences. Authentication, connectors, project trust,
# marketplace cache paths, histories, memories, and shell environment values stay local.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approvals_reviewer = "user"
personality = "pragmatic"

[agents]
max_threads = 10
max_depth = 1
job_max_runtime_seconds = 1800

[features]
apps = true
browser_use = true
computer_use = true
hooks = true
in_app_browser = true
memories = true
goals = true
multi_agent = true
plugins = true
prevent_idle_sleep = true
shell_snapshot = true
terminal_resize_reflow = true
tool_search = true
unified_exec = true
workspace_dependencies = true

[plugins."build-ios-apps@openai-curated"]
enabled = true
[plugins."build-macos-apps@openai-curated"]
enabled = true
[plugins."browser@openai-bundled"]
enabled = true
[plugins."chrome@openai-bundled"]
enabled = true
[plugins."computer-use@openai-bundled"]
enabled = true
[plugins."documents@openai-primary-runtime"]
enabled = true
[plugins."github@openai-curated"]
enabled = true
[plugins."gmail@openai-curated"]
enabled = false
[plugins."google-calendar@openai-curated"]
enabled = false
[plugins."hugging-face@openai-curated"]
enabled = true
[plugins."linear@openai-curated"]
enabled = false
[plugins."lovable@openai-curated"]
enabled = true
[plugins."netlify@openai-curated"]
enabled = false
[plugins."notion@openai-curated"]
enabled = true
[plugins."openai-developers@openai-curated"]
enabled = true
[plugins."pdf@openai-primary-runtime"]
enabled = true
[plugins."presentations@openai-primary-runtime"]
enabled = false
[plugins."replit@openai-curated"]
enabled = true
[plugins."sites@openai-bundled"]
enabled = true
[plugins."spreadsheets@openai-primary-runtime"]
enabled = false
[plugins."template-creator@openai-primary-runtime"]
enabled = true
[plugins."visualize@openai-bundled"]
enabled = true
